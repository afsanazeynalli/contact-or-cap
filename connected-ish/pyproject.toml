[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "connected-ish"
version = "0.1.0"
description = "Transparent, uncertainty-aware screening of fluid contacts and interwell connectivity."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Afsana Zeynalli"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
connected-ish = "connected_ish.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
